<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YS Studios | Yousef Sadiq</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <!-- The JS looks for this data attribute to know which array to render -->
  <body data-casestudy="ysstudios-game">
    <div class="portfolio-container">
      <!-- Back Link -->
      <a href="../game-dev.html" class="back-link fade-in"
        >← Back to Game Development</a
      >

      <!-- Case Study Header -->
      <header class="project-header fade-in" style="animation-delay: 0.1s">
        <h1>YS Studios</h1>
        <h2 style="margin-bottom: 5px">Founder & Lead Game Developer</h2>
        <p class="item-date">April 2026 - Present</p>

        <!-- Optional: External Links -->
        <div class="project-links">
          <a
            href="https://store.steampowered.com/app/4829810/The_Circus_That_Never_Left/"
            class="btn primary-btn"
            target="_blank"
            >The Circus That Never Left</a
          >
          <a
            href="https://www.linkedin.com/company/ys-studios/"
            class="btn secondary-btn"
            target="_blank"
            >LinkedIn</a
          >
        </div>
      </header>

      <!-- The Javascript will inject the stacked media/text blocks exactly here -->
      <section
        id="case-study-container"
        class="fade-in"
        style="animation-delay: 0.3s"
      ></section>

      <!-- FOOTER SECTION (Data injected by app.js) -->
      <footer
        class="site-footer fade-in"
        style="animation-delay: 0.5s"
      ></footer>
    </div>

    <!-- Required for dynamic rendering -->
    <script src="../app.js"></script>
  </body>
</html>
